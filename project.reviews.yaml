          line_start: 52
          path: addons/lada/packaging/build-bundles.sh
          side: head
        entries:
          - _ulid: 01KXZGBA9Q9C4ND9159D50WD2F
            author: "@claude"
            body: "MUST-FIX: the Corresponding Source tar archives the entire add-on root while `build/` and
              `dist/` live inside it. A reproduction confirms `build/` is included and tar warns
              that the output archive cannot contain itself. This can copy the multi-GB
              runtime/models into source and makes output depend on stale build state. Stage an
              explicit clean source tree or exclude generated directories, and behaviorally verify
              archive contents."
            created_at: 2026-07-20T10:15:05.271Z
        kind: blocker
      - _ulid: 01KXZGBBF7NGEHYA5E3MMQ9W55
        anchor:
