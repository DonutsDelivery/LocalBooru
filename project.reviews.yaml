    threads:
      - _ulid: 01KXZGB6EVXM1FS9TD2ACYPD0Y
        anchor:
          type: code
          commit: f64c423a6acff7b5005f82d2361ab3adb324210f
          line_end: 189
          line_start: 176
          path: addons/lada/src/localbooru_lada/server.py
          side: head
        entries:
          - _ulid: 01KXZGB6EVPACK9AW144KKVFGD
            author: "@claude"
            body: "MUST-FIX: seek reuses the same memfd slots after reset. A consumer that still maps an
              old-generation buffer immediately observes bytes written for the new generation
              (confirmed with a mapped-FD reproduction: old consumer read `new!`). Allocate and
              announce a fresh pool per generation, retire the old pool without reuse, and test that
              old mappings remain unchanged."
            created_at: 2026-07-20T10:15:01.339Z
          - _ulid: 01KXZH2QBWEXADX6PJDXREVF9F
            author: "@claude"
            body: "Fixed in 8370255: each generation allocates and announces a new FramePool; seek retires the
              producer's old mappings/FDs without reusing their backing storage. The socket-level
              regression keeps the old consumer mapping open through generation 2 and verifies its
              bytes remain unchanged."
            created_at: 2026-07-20T10:27:52.316Z
        kind: blocker
        resolved_at: 2026-07-20T10:27:53.575Z
        resolved_by: "@claude"
      - _ulid: 01KXZGB7Y3Q0WS1HKB6GC93FRX
        anchor:
          type: code
          commit: f64c423a6acff7b5005f82d2361ab3adb324210f
          line_end: 175
          line_start: 155
          path: addons/lada/src/localbooru_lada/server.py
          side: head
        entries:
          - _ulid: 01KXZGB7Y4HPRX6VN22F7H864F
            author: "@claude"
            body: "MUST-FIX: control messages are accepted before the nonce-bearing hello handshake. A client
              with access to the inherited socket can issue `open` directly, bypassing the protocol
              authentication the design promises. Track authenticated state and reject every
              non-hello command until a valid nonce/protocol hello succeeds; add a behavioral test."
            created_at: 2026-07-20T10:15:02.852Z
          - _ulid: 01KXZH2SQKXWW03HPB25JS5WXJ
            author: "@claude"
            body: "Fixed in 8370255: the server tracks authenticated state and rejects every non-hello command
              until nonce, protocol, and coordinator role validate. The regression proves pre-auth
              open returns protocol_error without creating a generation."
            created_at: 2026-07-20T10:27:54.739Z
        kind: blocker
        resolved_at: 2026-07-20T10:27:55.809Z
        resolved_by: "@claude"
      - _ulid: 01KXZGB925VK9C7B68TG3BMWF5
        anchor:
          type: code
          commit: f64c423a6acff7b5005f82d2361ab3adb324210f
          line_end: 79
          line_start: 74
          path: addons/lada/src/localbooru_lada/adapter.py
          side: head
        entries:
          - _ulid: 01KXZGB9260DT4XVB45S6SQHYE
            author: "@claude"
            body: "MUST-FIX: LADA ErrorMarker subclasses Exception and stores no `.error` or `.exception`
              attribute. This branch therefore converts actual restoration failures into
              StopIteration/EOS, preventing fail-open diagnostics. Handle Exception/ErrorMarker
              explicitly and add a test that a worker error becomes `restoration_failed` rather than
              EOS."
            created_at: 2026-07-20T10:15:04.006Z
          - _ulid: 01KXZH2VX96ZCA9JTJH5WCYNBN
            author: "@claude"
            body: "Fixed in 8370255: adapter output that is an Exception/ErrorMarker now raises RuntimeError
              using its stack_trace, so the server emits restoration_failed rather than EOS. A
              focused fake ErrorMarker regression covers the upstream object shape."
            created_at: 2026-07-20T10:27:56.969Z
        kind: blocker
        resolved_at: 2026-07-20T10:27:58.206Z
        resolved_by: "@claude"
      - _ulid: 01KXZGBA9P2PP6FKDZF9Z1QY7K
        anchor:
          type: code
          commit: f64c423a6acff7b5005f82d2361ab3adb324210f
          line_end: 62
          line_start: 52
          path: addons/lada/packaging/build-bundles.sh
          side: head
        entries:
          - _ulid: 01KXZGBA9Q9C4ND9159D50WD2F
            author: "@claude"
            body: "MUST-FIX: the Corresponding Source tar archives the entire add-on root while `build/` and
              `dist/` live inside it. A reproduction confirms `build/` is included and tar warns
              that the output archive cannot contain itself. This can copy the multi-GB
              runtime/models into source and makes output depend on stale build state. Stage an
              explicit clean source tree or exclude generated directories, and behaviorally verify
              archive contents."
            created_at: 2026-07-20T10:15:05.271Z
          - _ulid: 01KXZH2Y8Q7S44DS70P97WTN47
            author: "@claude"
            body: "Fixed in 8370255: stage-source.sh now builds an explicit source tree from tracked git
              archives for the add-on and pinned upstream checkout, and build-bundles archives only
              that stage. The behavioral test injects ignored build/dist contaminants, creates and
              inspects a source archive, and proves they are absent."
            created_at: 2026-07-20T10:27:59.382Z
        kind: blocker
        resolved_at: 2026-07-20T10:28:00.589Z
        resolved_by: "@claude"
      - _ulid: 01KXZGBBF7NGEHYA5E3MMQ9W55
        anchor:
          type: code
          commit: f64c423a6acff7b5005f82d2361ab3adb324210f
          line_end: 48
          line_start: 39
          path: addons/lada/src/localbooru_lada/release.py
          side: head
        entries:
          - _ulid: 01KXZGBBF7AKHTHEBY8NJH8HT8
            author: "@claude"
            body: "MUST-FIX: the base-artifact audit rejects every `.pt` or `.pth` anywhere, not specifically
              LADA payloads. Executing it against `usr/share/unrelated-addon/model.pt` raises a LADA
              violation, so legitimate unrelated model add-ons would fail release verification.
              Match the exact pinned LADA filenames and LADA/runtime paths instead, with a non-LADA
              model regression test."
            created_at: 2026-07-20T10:15:06.471Z
          - _ulid: 01KXZH30QB24MH6JJZHS12Q78C
            author: "@claude"
            body: "Fixed in 8370255: base auditing now matches exact pinned LADA model basenames plus
              LADA/runtime paths rather than all .pt/.pth files. The regression explicitly allows
              unrelated model.pt and checkpoint.pth paths."
            created_at: 2026-07-20T10:28:01.899Z
        kind: blocker
        resolved_at: 2026-07-20T10:28:03.109Z
        resolved_by: "@claude"
      - _ulid: 01KXZGC1X5VHMQXXM1VARCJ207
        anchor:
          type: code
          commit: f64c423a6acff7b5005f82d2361ab3adb324210f
          line_end: 18
          line_start: 9
          path: addons/lada/tests/test_release.py
          side: head
        entries:
          - _ulid: 01KXZGC1X5K9HFRFHVBAXE5Z2K
            author: "@claude"
            body: "MUST-FIX: this annotation claims the Add-on Manager disclosure AC, but the test only loads a
              JSON metadata function and never renders or exercises Add-on Manager. Do not count
              this as full UI behavior coverage. Move the annotation to the later behavioral UI
              test, or refine the spec/task split so this test targets a package-metadata AC while
              retaining an explicit UI disclosure AC."
            created_at: 2026-07-20T10:15:29.445Z
          - _ulid: 01KXZH330XH76MGFQ1W7AK18AR
            author: "@claude"
            body: "Fixed in 8370255: removed the false Add-on Manager AC annotation from the metadata-loader
              test. Added a durable note on @integrate-lada-player-ui requiring the real rendered
              pre-install disclosure test to carry @lada-license-provenance ac-license-disclosure;
              the metadata test remains unannotated package validation."
            created_at: 2026-07-20T10:28:04.253Z
        kind: blocker
        resolved_at: 2026-07-20T10:28:05.517Z
        resolved_by: "@claude"
