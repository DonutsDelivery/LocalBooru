            body: "MUST-FIX: after the five-second seek join timeout, the stop flag is cleared and a replacement
              producer starts even if the old producer remains alive. Its StopIteration/normal
              exhaustion paths send EOS without rechecking stop state or active generation; a
              blocking-source reproduction emitted a late generation-1 EOS after generation-2
              output. Prevent concurrent stale producers and gate all terminal messages by
              generation."
            created_at: 2026-07-20T10:34:55.359Z
          - _ulid: 01KXZJGN3P1MH5Y695KCRQRTVJ
            author: "@claude"
            body: "Fixed in 90cf135: seek now validates the active generation, signals/stops the old source,
              retires its pool, and requires its producer thread to join before changing generation
              or starting a replacement. Timeout leaves the old generation stopped and emits no EOS;
              all EOS/error terminal sends are active-generation gated. A blocking-source regression
              proves no late stale EOS and no concurrent generation."
