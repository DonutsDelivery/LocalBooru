      - _ulid: 01KY30W98DQD4XTYNN5ZR3ZT45
        anchor:
          type: code
          commit: f31d5a9686279429cb0fc9136491d2ff71c0dbf3
          line_end: 293
          line_start: 293
          path: src-tauri/src/services/wd14_sidecar.rs
          side: head
        entries:
          - _ulid: 01KY30W98EZMNHVBPVRWG0NM76
            author: DonutsDelivery
            body: The importer validates metadata and then reopens the sidecar by pathname. A replacement
              between those operations can bypass the symlink/size checks, and fs::read allocates
              the replacement file before the parser enforces its byte cap. Open once with no-follow
              where supported, validate that handle, and bounded-read at most MAX+1 bytes.
            created_at: 2026-07-21T19:01:41.774Z
        kind: blocker
      - _ulid: 01KY30WBVBSM51YGJ9M5R36D97
        anchor:
          type: code
          commit: f31d5a9686279429cb0fc9136491d2ff71c0dbf3
          line_end: 357
          line_start: 346
          path: src-tauri/src/services/wd14_sidecar.rs
          side: head
        entries:
          - _ulid: 01KY30WBVBYTGN29MRB0T7CNXY
            author: DonutsDelivery
            body: Absorb revalidates only the current path type before unlinking. If the original sidecar is
              replaced by a different valid regular file after import, the replacement is deleted
              even though its tags were never imported. Preserve and compare stable file
              identity/content before removal.
            created_at: 2026-07-21T19:01:44.427Z
        kind: blocker
      - _ulid: 01KY30WD6JJSVMJS57EMGF12ZG
        anchor:
          type: code
          commit: f31d5a9686279429cb0fc9136491d2ff71c0dbf3
          line_end: 221
          line_start: 211
          path: src-tauri/src/services/wd14_sidecar.rs
          side: head
        entries:
          - _ulid: 01KY30WD6KT3CJ572RQJREQFP4
            author: DonutsDelivery
            body: The 50k candidate cap is checked only after every selected database has been fully collected
              into memory. Large databases can consume unbounded memory/work before rejection.
              Iterate with a remaining limit or query LIMIT remaining+1 and abort before
              accumulation exceeds the bound.
            created_at: 2026-07-21T19:01:45.811Z
        kind: blocker
      - _ulid: 01KY30WEJNMZYBB1V701R3SKYF
        anchor:
          type: code
          commit: f31d5a9686279429cb0fc9136491d2ff71c0dbf3
          line_end: 715
          line_start: 707
          path: src-tauri/src/services/wd14_sidecar.rs
          side: head
        entries:
          - _ulid: 01KY30WEJPNGFAC834RNW2M72Q
            author: DonutsDelivery
            body: Distinct non-UTF8 Unix paths collapse through to_string_lossy and can be grouped as one
              sidecar, applying tags across unrelated media or producing false export conflicts.
              Group by native PathBuf/OsString identity without lossy display conversion.
            created_at: 2026-07-21T19:01:47.222Z
        kind: blocker
      - _ulid: 01KY30WFYR6KGQD4GB4RJB1CGW
        anchor:
          type: code
          commit: f31d5a9686279429cb0fc9136491d2ff71c0dbf3
          line_end: 493
          line_start: 440
          path: src-tauri/src/services/wd14_sidecar.rs
          side: head
        entries:
          - _ulid: 01KY30WFYRFJM63Q5X3CS33CWA
            author: DonutsDelivery
            body: The attached transaction spans two WAL databases and incrementally changes post_count. SQLite
              does not provide crash-atomic multi-file commits in this mode, so a crash can leave
              associations and counts inconsistent and retries may double count. Use idempotent
              per-database writes plus authoritative count reconciliation, or another recoverable
              design.
            created_at: 2026-07-21T19:01:48.632Z
        kind: blocker
      - _ulid: 01KY30WHDGZD58W4Z5YR33PNKY
        anchor:
          type: code
          commit: f31d5a9686279429cb0fc9136491d2ff71c0dbf3
          line_end: 958
          line_start: 838
          path: src-tauri/src/services/wd14_sidecar.rs
          side: head
        entries:
          - _ulid: 01KY30WHDGS0ZDQRE1TDC6E2KS
            author: DonutsDelivery
            body: "The ac-safe-absorb test does not exercise the service: it toggles a local boolean and deletes
              a file directly. The ac-shared-stem test likewise only checks path derivation and set
              equality. Replace them with behavioral tests proving multi-target import/absorb,
              retained sidecars after target failure, and conflict/no-write behavior."
            created_at: 2026-07-21T19:01:50.128Z
        kind: blocker
      - _ulid: 01KY30WK6SDKEGMJ1YSGYGE9H3
        anchor:
          type: code
          commit: f31d5a9686279429cb0fc9136491d2ff71c0dbf3
          line_end: 518
          line_start: 496
          path: src-tauri/src/services/wd14_sidecar.rs
          side: head
        entries:
          - _ulid: 01KY30WK6SSWQTXK87Z8BJVY15
            author: DonutsDelivery
            body: Export resolves each tag ID with one main-database query, yielding potentially millions of
              SQLite calls for a bounded 50k-media export. Batch tag-name loading for each image (or
              reuse/extract the existing directory tag helper) before this can safely serve as a
              batch operation.
            created_at: 2026-07-21T19:01:51.961Z
        kind: blocker
      - _ulid: 01KY30XPQQVYXN5V00AQJTZNJA
        anchor:
          type: code
          commit: f31d5a9686279429cb0fc9136491d2ff71c0dbf3
          line_end: 556
          line_start: 551
          path: src-tauri/src/services/wd14_sidecar.rs
          side: head
        entries:
          - _ulid: 01KY30XPQQH5B2JBSY30H76MX7
            author: DonutsDelivery
            body: Export serializes unrestricted database tag names by joining with commas/newlines. Existing
              tags containing commas or controls cannot round-trip and can split into multiple tags
              or be rejected; export also bypasses parser byte/tag limits. Validate representability
              and limits before writing, with a failure that leaves the destination untouched.
            created_at: 2026-07-21T19:02:28.343Z
        kind: blocker
