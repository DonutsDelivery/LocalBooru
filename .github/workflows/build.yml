name: Linux release fallback

# Normal Linux releases are built locally with scripts/build-linux-local.sh.
# This manual workflow is an escape hatch and deliberately uses the exact same
# Docker entry point. Tag pushes do not publish artifacts automatically.
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: Bundle set
        required: true
        default: all
        type: choice
        options:
          - all
          - appimage
          - deb
          - rpm

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune -af

      - name: Build release artifacts through the project Docker wrapper
        env:
          LOCALBOORU_BUILD_JOBS: "2"
          LOCALBOORU_CCACHE_SIZE: 8G
        run: |
          case "${{ inputs.bundles }}" in
            all) ./scripts/build-linux-local.sh --jobs 2 ;;
            appimage) ./scripts/build-linux-local.sh --appimage --jobs 2 ;;
            deb) ./scripts/build-linux-local.sh --deb --jobs 2 ;;
            rpm) ./scripts/build-linux-local.sh --rpm --jobs 2 ;;
          esac

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalBooru-Linux
          path: dist-linux-local/
          if-no-files-found: error
          retention-days: 14