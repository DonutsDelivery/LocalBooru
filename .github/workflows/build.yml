name: Release build fallback

# Linux uses the same Docker wrapper as local releases. Windows and macOS are
# built natively so their platform toolchains and bundle formats are verified.
# This workflow uploads CI artifacts only; it never publishes a release.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos
          - linux
          - all
      bundles:
        description: Linux bundle set (ignored for macOS)
        required: true
        default: all
        type: choice
        options:
          - all
          - appimage
          - deb
          - rpm

permissions:
  contents: read

jobs:
  windows-release:
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'all' }}
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Windows Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target
          shared-key: localbooru-windows-x64

      - name: Cache pinned Tauri CLI
        id: cache-tauri-cli-windows
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2.9.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned Tauri CLI
        if: steps.cache-tauri-cli-windows.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.9.4 --locked

      - name: Build and verify Windows x64 artifacts
        shell: pwsh
        run: ./scripts/build-windows-ci.ps1

      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalBooru-Windows-x64
          path: dist-windows/
          if-no-files-found: error
          retention-days: 14

  linux-release:
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune -af

      - name: Build release artifacts through the project Docker wrapper
        env:
          LOCALBOORU_BUILD_JOBS: "2"
          LOCALBOORU_CCACHE_SIZE: 8G
        run: |
          case "${{ inputs.bundles }}" in
            all) ./scripts/build-linux-local.sh --jobs 2 ;;
            appimage) ./scripts/build-linux-local.sh --appimage --jobs 2 ;;
            deb) ./scripts/build-linux-local.sh --deb --jobs 2 ;;
            rpm) ./scripts/build-linux-local.sh --rpm --jobs 2 ;;
          esac

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalBooru-Linux
          path: dist-linux-local/
          if-no-files-found: error
          retention-days: 14

  macos-release:
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'all' }}
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up universal Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target
          shared-key: localbooru-macos-universal

      - name: Cache pinned Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2.9.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.9.4 --locked

      - name: Build and verify universal macOS artifacts
        run: ./scripts/build-macos-ci.sh

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalBooru-macOS-universal
          path: dist-macos/
          if-no-files-found: error
          retention-days: 14
