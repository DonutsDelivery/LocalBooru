notes:
  - _ulid: 01KY28YASXB6E33JW40XDK6F3E
    content: "Tester evidence: successful Apply is followed occasionally by an optional GET
      /images/:id/preview-frames request containing directory_id only. Root cause is incomplete
      preview identity plus unowned retry/response lifetime; adjustment persistence itself
      succeeds."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-21T12:03:23.069Z
  - _ulid: 01KY2A8NFVBGM1BC6RN33AX4G3
    content: Implemented exact video-only preview identity and request ownership across
      Lightbox/grid/API/Rust routes. Preview list/frame routes now require library, directory, and
      current file hash, use the resolved library cache, and optional 404s are request-scoped.
      Frontend, route, full Rust, and build verification pass.
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-21T12:26:30.267Z
  - _ulid: 01KY2CECCVJ247GPARAWZF99FP
    content: Implemented exact library/directory/image/hash preview identity, video-only requests,
      request-owned cancellation, restartable bounded polling, resolved-library caches, validated
      source snapshots, and atomic single-flight publication. Verified 94 frontend tests, 168 Rust
      tests, production build, and adversarial review.
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-21T13:04:34.715Z
  - _ulid: 01M0Y30QAMFM82TM18BSNXP308
    content: "Follow-up: removed full-media source snapshots from thumbnail and timeline-preview
      generation after a /tmp leak filled tmpfs. Generation now decodes the canonical source
      directly, validates its content hash before work and again before publication, discards stale
      staging, and globally limits preview generation to two concurrent jobs. Focused Rust tests and
      npm run build pass."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-08-26T03:49:57.716Z
