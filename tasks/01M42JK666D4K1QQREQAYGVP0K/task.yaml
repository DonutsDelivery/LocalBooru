title: Bound release build resources and reject low disk headroom
type: infra
description: After repeated host crashes, default one compiler job; cap Linux/Windows artifact
  containers at12GiB RAM,2GiB swap and2 CPUs; reject invalid caps and less than30GiB free on root or
  any build/cache/output filesystem before compilation. Preserve shared host build lock. Test
  behavior with fake container/build commands, no compilation. Document toolchain-image limit scope
  and separate KVM kernel blocker.
