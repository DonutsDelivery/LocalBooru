notes:
  - _ulid: 01KXZT06H66W5H3Q8N0JF4M3S0
    content: >-
      Implementation notes (auto-generated from spec):


      Folder catalogs display representative media previews while browsing one directory or all
      directories together.



      Acceptance Criteria:

      - ac-all-directories: Given the gallery includes media from multiple directories and the
      directory filter is set to All directories, when the user enables Group by folders, then each
      nonempty folder catalog displays its representative preview thumbnail

      - ac-directory-identity: Given different directories contain media with overlapping local
      identifiers, when folder catalogs are rendered across all directories, then each preview
      resolves from the same library and directory as its represented media
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T13:03:46.727Z
  - _ulid: 01KXZT0ETQR5R7H6RZ9C3B3AKS
    content: "Approach: trace grouped catalog construction from mixed-directory image payloads through
      representative thumbnail URL rendering, reproduce the All directories case in a focused
      behavioral test, preserve full library/directory identity, then verify single-directory
      behavior remains unchanged."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T13:03:55.223Z
  - _ulid: 01KXZTR41455XY923RY8G2T5ZB
    content: "Root cause: grouped folder aggregation manually emitted thumbnail URLs with only
      directory_id, while the exact thumbnail route now requires library_id and directory_id. All
      such requests returned 400, and All directories additionally risks colliding numeric IDs.
      Representative folder queries now carry file_hash and generate encoded library_id,
      directory_id, image_id, and file_hash URLs. Test-first failure was undefined identity-safe
      builder; focused test passed and full Rust suite passed 152/152 with fmt/diff checks."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T13:16:50.597Z
