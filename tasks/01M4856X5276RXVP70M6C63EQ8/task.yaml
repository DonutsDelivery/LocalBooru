title: Reduce repeated relay setup during offline downloads
type: bug
description: Reduce repeated relay WebSocket/client setup for slow downloads. Keep all advertised
  original/thumbnail/preview variants. Current gateway is single-use per QUIC connection; pool only
  bounded exact peer/relay/transport-mode Iroh endpoints, open a fresh request connection and
  preserve current protocol. Retain fresh auth headers, pin validation, streaming permits/limits,
  cancellation/resource cleanup and idle eviction. Synthetic tests must emulate current gateway
  closing after every request, count reused endpoint bindings and fresh connections, verify header
  isolation and dropped-body behavior. No user files/accounts/production protected queries;
  review/main/install.
