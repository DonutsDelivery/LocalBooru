description: User reports slow downloads and asks if thumbnails retained. Confirm all advertised
  original/thumbnail/preview variants retained. Current per-source item serialization plus transport
  creates/closes Iroh endpoint/QUIC connection for every request. Reduce repeated relay setup with
  bounded reusable sessions keyed by exact peer/relay/transport mode while retaining streaming
  limits, fresh auth headers, pin validation, profile boundaries, failures/cancellation and
  denied-cache behavior. Measure with synthetic behavioral transport tests; no user
  library/credentials/media or production protected requests. Independent review/main/install; keep
  thumbnails included.
