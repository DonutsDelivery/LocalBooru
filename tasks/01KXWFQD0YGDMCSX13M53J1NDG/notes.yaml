      committed-decision preservation across refill failure, and independent Loading/Retry/Exit
      recovery UI. Full frontend suite passes 61/61 and focused gesture/recovery suite passes 13/13;
      production build passes. Windows manual fullscreen verification remains outstanding.
    supersedes: null
