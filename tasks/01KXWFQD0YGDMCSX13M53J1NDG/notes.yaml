notes:
  - _ulid: 01KXWFQD0XCSF4H501E21N59ZN
    content: >-
      Implementation notes (auto-generated from spec):


      Curation fullscreen gestures commit at most one decision and keep candidate discovery
      recoverable when refilling fails.



      Acceptance Criteria:

      - ac-1: Given Curation Game is active at default zoom with one touch on the media surface,
      when a horizontally dominant swipe exceeds 50 pixels, then a right swipe commits Keep and a
      left swipe commits Discard without invoking lightbox navigation or sidebar gestures

      - ac-2: Given Curation Game is active, when a gesture is a pinch, begins on a control, occurs
      while zoomed or panning, is vertically dominant, or does not exceed the threshold, then no
      curation decision is committed

      - ac-3: Given a curation decision is already mutating, advancing the queue, or refilling, when
      touch, keyboard, or button input requests another decision, then the current candidate is
      committed at most once

      - ac-4: Given the current candidate was successfully kept or discarded and the queue becomes
      empty, when candidate refill is pending or fails, then the committed decision is not repeated
      and the UI shows loading or visible Retry and Exit recovery controls instead of a black
      unrendered state

      - ac-5: Given candidate refill previously failed after a successful decision, when the user
      retries or exits, then Retry resumes discovery with the existing query and progress without
      replaying the decision, while Exit returns to a refreshed gallery

      - ac-6: Given Curation Game is inactive, when the same touch gestures are used in the
      lightbox, then existing sidebar, pinch, zoom, pan, navigation, and video behavior remains
      unchanged
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-19T06:06:29.406Z
  - _ulid: 01KXWFQVWSTRP8JH8ATXYMHQPY
    content: "Approach: write pure gesture and curation state tests first; reuse the existing 50px
      horizontal classifier semantics; give active curation precedence without changing inactive
      lightbox behavior; serialize the entire mutation/advance/refill transaction with an immediate
      ref lock; render loading and Retry/Exit independently of a current candidate. Edge cases:
      pinch, zoom, pan, controls, vertical movement, duplicate touch/key/button input, failed
      mutation, final-item refill failure, retry without replay, and exit refresh. Test plan: ACs
      1-6 each receive behavioral coverage."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-19T06:06:44.633Z
  - _ulid: 01KXWG8HT1FW2ZD4EQX2J693ZE
    content: "Implemented the test-first curation repair: pure 50px horizontal swipe classification now
      rejects pinch/control/zoom/pan/vertical gestures; active curation maps right to Keep and left
      to Discard before sidebar handling; an immediate lock spans mutation, queue advancement, and
      refill; committed actions survive refill failure; Retry resumes discovery and Exit refreshes
      the gallery; empty loading/error runs render a recovery overlay instead of no UI. Focused
      behavioral tests and the production frontend build pass. Targeted lint reports only
      pre-existing errors in touched large files plus the pre-existing useZoomPan render-ref
      warning."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-19T06:15:51.361Z
  - _ulid: 01KXWHSQTPVZZXB5N396GNX200
    content: Windows 2.0.2 evidence confirms the candidate renders initially, then either horizontal
      fullscreen swipe removes the image visually, performs no Keep/Discard move, and leaves a black
      soft-lock requiring refresh. This narrows the failure to curation gesture/queue handling
      rather than initial ordinary image decode.
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-19T06:42:43.158Z
  - _ulid: 01KXWJTVA1JDQD86Q90HRDT2XT
