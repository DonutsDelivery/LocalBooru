notes:
  - _ulid: 01KXTTBR28W3AT55N2H0W14YZZ
    content: >-
      Implementation notes (auto-generated from spec):


      Desktop activation preserves and reveals an existing LocalBooru instance instead of replacing
      it, while retaining normal launch behavior when no instance is running.



      Acceptance Criteria:

      - ac-1: Given a recognized development instance is running with its window hidden or
      minimized, when the normal desktop launcher is activated, then the running process remains
      alive and its existing window is restored and focused

      - ac-2: Given a recognized development instance is running, when the normal desktop launcher
      receives a file or URI argument, then the argument is delivered unchanged to the running
      instance

      - ac-3: Given a recognized development instance is running while installed assets are
      unavailable or build preparation is busy, when the normal desktop launcher is activated, then
      the existing instance is contacted without waiting for installed-build preparation

      - ac-4: Given no recognized development instance is running, when the normal desktop launcher
      is activated, then the installed application launches with the supplied arguments
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T14:33:52.968Z
  - _ulid: 01KXTTCDM9T6QTN73201325TZQ
    content: "Approach: replace run.sh's dev SIGTERM path with exact-executable single-instance
      activation before installed-build checks. Preserve original arguments and propagate activation
      failures. Tests: a temporary compiled helper proves the resident PID survives, arguments are
      forwarded, build preparation is bypassed, and installed fallback remains unchanged. No changes
      to Tauri close/Quit behavior."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T14:34:15.049Z
  - _ulid: 01KXTVVS9W8G225GHDPW9TJ9CP
    content: "Review refinement: replaced process-path discovery/re-execution with a bounded direct call
      to Tauri's session D-Bus single-instance endpoint. This removes PID/path/readiness races,
      avoids launching a 589 MB debug binary, works when installed assets are missing or the build
      lock is held, and gets an actual method-call result. If the owner disappears, normal installed
      launch continues; if the owner remains but activation fails, the launcher reports the failure
      rather than creating a competing instance. AC-2 was narrowed from unsupported URI forwarding
      to supported file paths."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T15:00:07.100Z
