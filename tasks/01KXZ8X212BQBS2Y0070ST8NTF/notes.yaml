      CAS/ambiguity/symlink checks, rollback across DB commit, alpha preservation, shared-thumbnail
      safety, and canonical locators for list/collection payloads. Verification in integration
      worktree: frontend 74/74 (includes unrelated existing local tests), Rust 150/150, production
      frontend build passed, cargo fmt/diff checks passed."
