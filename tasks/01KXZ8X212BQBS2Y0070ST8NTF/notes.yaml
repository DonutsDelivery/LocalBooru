notes:
  - _ulid: 01KXZ8X211SQV5VW1AEC5D3991
    content: >-
      Implementation notes (auto-generated from spec):


      Image adjustment previews and permanent changes remain owned by the exact library image
      selected by the user.



      Acceptance Criteria:

      - ac-1: Given different directories or libraries contain images with the same local numeric
      identifier, when the user previews or applies adjustments to one image, then only the selected
      library and directory image is read, previewed, or modified

      - ac-2: Given an older preview request completes after the user changes adjustments or
      navigates to another image, when the older response arrives, then it cannot replace the
      current image or current adjustment preview

      - ac-3: Given an image adjustment cannot be encoded or committed, when the operation fails,
      then the original file remains intact and the failure is reported

      - ac-4: Given an image adjustment is applied successfully, when the image is reopened or
      displayed in the gallery, then the adjusted file, refreshed metadata, and refreshed thumbnail
      are shown for the same image
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T08:04:58.017Z
  - _ulid: 01KXZA0T6ZANHV7EE73BTMZKK3
    content: "Approach: test colliding library/directory image IDs first, then require full locators
      through frontend/backend; namespace exact previews, guard stale responses, preserve URL
      locators, and atomically replace files before refreshing exact metadata/thumbnails. Reuse
      library resolution and importer/hash utilities. Edge cases: duplicate IDs, navigation during
      preview, failed encoding/replacement, alpha-bearing images, and stale thumbnails."
    supersedes: null
    author: "@claude"
    created_at: 2026-07-20T08:24:29.664Z
  - _ulid: 01KXZC3A1F7DEKFX4WE7ZG01TQ
    content: "First implementation commit 8f7b4200 was not integrated after adversarial review found
      blockers: DB commit could fail after source replacement; duplicate file rows and concurrent
      writers could desynchronize shared metadata; library-wide thumbnails could be deleted while
      still shared; previews could race/delete each other or expose partial files; stale mutating
      Apply responses were dropped; concurrent Apply remained possible; and upstream image
      selection/payloads still used incomplete identity in some surfaces. Implementation is being
      revised with CAS/rollback, exact preview ownership, full-locator propagation, and cross-file
      behavioral tests before integration."
    supersedes: null
    author: "@claude"
    created_at: 2026-07-20T09:00:48.559Z
  - _ulid: 01KXZFCASQH0ZDY3EAS27HNVNQ
