title: Fix Android cold-boot WebView-version timeout crash before DMC 2.1.0 release
type: bug
description: "Exact permanently signed 756dd55 APK on disposable Android16.1/16384-page emulator
  aborts when launched immediately after cold boot during host build load; ordinary second launch
  recovers. Crash binary panic-location decoded from ELF relocations proves Wry0.54.1
  src/android/mod.rs:474:38 platform_webview_version unwrap of ten-second GetWebViewVersion response
  timeout. Evidence outside repo: android-cold-boot-crash-756dd55.txt/json under
  ~/.local/state/localbooru/releases/2.1.0. Fix the dependency/platform startup behavior durably,
  preserve existing user library and signing identity, add focused timeout behavior coverage,
  rebuild exact-source signed APK/AAB and verify cold boot plus normal startup and pairing. Do not
  substitute API health for visible UI startup. No publication until fixed."
