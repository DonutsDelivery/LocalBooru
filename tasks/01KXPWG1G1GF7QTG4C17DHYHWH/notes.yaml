  - _ulid: 01KXPWG1G0Y68KCQ4JP5RQP218
    content: >-
      Implementation notes (auto-generated from spec):


      Video playback changes between the original source and generated streaming qualities without
      allowing superseded sources to take control or lose the user's playback intent.



      Acceptance Criteria:

      - ac-final-source-owner: Given multiple quality or original-source changes are requested
      before playback is ready, when the final requested source becomes available, then only the
      final requested source can produce audio or video

      - ac-preserve-playback-intent: Given a video is playing or paused at a nonzero source
      position, when playback changes between the original source and a generated streaming quality,
      then playback returns at the same source position and retains its playing or paused state

      - ac-stop-superseded-producer: Given a generated stream is preparing or active, when another
      source supersedes it or the video is closed, then the superseded stream stops and cannot later
      reclaim playback

      - ac-reload-restarted-source: Given a generated stream is restarted with changed settings but
      retains the same playback address, when the replacement becomes ready, then the player uses
      the replacement content rather than continuing the prior stream
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-17T01:54:13.121Z
  - _ulid: 01KXPWGJPXRQ7NQPDACPRXEAPQ
    content: "Approach: reuse the existing absolute-time offsets, image identity guards, HLS teardown,
      and MSE generation ownership. Add a small latest-transition generation/snapshot coordinator
      for SVP and transcode source changes, then add internal cancellation epochs so abandoned
      backend starts cannot publish. Edge cases: rapid inverse toggles, disable during start, image
      navigation, paused/ended intent, same URL replacement, and another agent concurrently changing
      Windows/macOS SVP session support. Test plan: pure coordinator tests for all four linked ACs
      plus SVP-specific AC annotations, focused Python/Rust epoch tests, then recursive frontend,
      Python, Cargo, lint/build, and real-app checks. Branch isolation is intentionally skipped
      because multiple user-authorized agents share the current dirty v2 checkout; changing branches
      would disrupt their active work."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-17T01:54:30.749Z
  - _ulid: 01KXPYHFC1B0P2KNAHD95RJ0Y2
    content: Implemented the first complete transition-ownership pass. Frontend now captures
      authoritative absolute position/play intent, aborts and generation-guards stale SVP/transcode
      starts, rebuilds same-URL HLS via source revisions, restores guarded direct playback,
      serializes/coalesces SVP config toggles, removes the menu's delayed duplicate restart, and
      guards HLS callbacks/cleanup. Backend legacy SVP and transcode starts now use ownership
      epochs; the Python sidecar rejects stopped/superseded starts and no longer returns an unready
      stream. Added AC-annotated JS, Rust, and Python tests. Recursive frontend suite now discovers
      44 tests (all passing); frontend build, focused Rust tests, and legacy Python tests pass. Kept
      Windows/macOS Manager graph work isolated and coordinated settings.rs timing with the other
      active agent.
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-17T02:29:57.249Z
  - _ulid: 01KXX1HYWJHMEZ7SWFGRZH0WT7
    content: "Follow-up: made stale/overlapping SVP stop cleanup idempotent at both Rust bridge and
      Python sidecar boundaries. Superseded stops preserve the newer producer but now return success
      rather than leaking a 409 through the bridge as duplicate 500 UI errors. Added
      @svp-single-player ac-idempotent-stop and AC-annotated Rust/Python regressions; all 31 SVP
      tests and all 139 Rust library tests pass."
