notes:
  - _ulid: 01KY216QGVNRAPWCRVZF875GF0
    content: "Root cause: run-dev.sh opens build-cache.lock on fd 8 and execs npm, so the descriptor is
      inherited by Cargo and the running app. Approach: dev sessions retain a distinct nonblocking
      dev-instance.lock; actual build and cleanup scripts remain the only owners of
      build-cache.lock. Tests use fake npm and isolated state to prove both domains remain exclusive
      but independent."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-21T09:48:09.627Z
  - _ulid: 01KY21D3JW6TSYHMFTW821D2XC
    content: "Behavioral verification passed: isolated fake-npm tests prove duplicate dev launch
      rejection, natural dev-lock release, active dev/build-lock independence, and dev startup while
      build-cache.lock is held. Existing launcher and truthful build startup handshake tests also
      pass. Alignment validation retains only five pre-existing warnings."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-21T09:51:38.588Z
  - _ulid: 01KY21EQ7MT6T9WQYQN0B4B5HK
    content: Implemented and committed as 3f43d5f4. run-dev.sh now owns dev-instance.lock only;
      build-cache.lock remains exclusive to build/cleanup operations. Focused and existing
      lock/launcher tests pass.
    supersedes: null
