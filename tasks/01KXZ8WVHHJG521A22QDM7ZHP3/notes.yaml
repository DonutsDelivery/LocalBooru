notes:
  - _ulid: 01KXZ8WVHHV3MGJQPQP6KDBCFW
    content: >-
      Implementation notes (auto-generated from spec):


      Windows users can copy supported library images to the native clipboard and paste them into
      other applications.



      Acceptance Criteria:

      - ac-1: Given a supported image is open in the Windows desktop app, when the user invokes Copy
      Image, then the decoded image is written to the native clipboard and can be pasted into
      another application

      - ac-2: Given the image cannot be fetched or decoded, or the native clipboard rejects the
      write, when the user invokes Copy Image, then the app reports the actual failure and does not
      claim that the image was copied

      - ac-3: Given a PNG, JPEG, or WebP image is copied, when the clipboard contents are inspected
      by a native consumer, then the copied pixels have the source image dimensions and supported
      transparency
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T08:04:51.377Z
  - _ulid: 01KXZ97CY6XKMSQS27ZZT24ZQR
    content: "Approach: preserve the frontend command contract, decode fetched bytes with the existing
      image crate, convert to owned RGBA, and write through the already configured Tauri
      clipboard-manager plugin. Tests cover supported format decoding/dimensions/transparency and
      corrupt-image failure before Windows-target compilation and native paste acceptance."
    supersedes: null
    author: DonutsDelivery
