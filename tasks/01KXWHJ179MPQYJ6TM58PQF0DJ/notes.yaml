notes:
  - _ulid: 01KXWHJ178B8JCXMZ5VQ1WZN67
    content: >-
      Implementation notes (auto-generated from spec):


      Opening a gallery image outside Curation Game renders the requested media or an actionable
      error without activating explicit-exit cleanup.



      Acceptance Criteria:

      - ac-1: Given the gallery contains a supported image and Curation Game is inactive, when the
      user opens that image in the ordinary lightbox, then the lightbox requests and visibly renders
      the selected full-resolution image rather than remaining black or empty

      - ac-2: Given an ordinary lightbox media request or decode fails, when the lightbox cannot
      render the selected image, then the lightbox presents an actionable error or retry state
      instead of an indistinguishable black empty surface

      - ac-3: Given the application is running normally, when the user opens or closes an ordinary
      lightbox, then explicit-exit cleanup does not run and add-on, transcode, and server lifecycle
      state remains active
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-19T06:38:30.633Z
  - _ulid: 01KXWHJM4JY96EM2JY0DNP37HN
    content: "Approach: reproduce the exact 2.0.2 packaged ordinary-image path before changing behavior;
      compare packaged assets/config with 2.0.1 and trace gallery selection through media
      response/decode. Preserve explicit-exit cleanup and add behavioral coverage for visible
      rendering, decode/request failure recovery, and lifecycle isolation. Edge cases: supported
      WebP decode, failed media request, close/reopen, curation inactive. Test plan: executable
      frontend behavior for ac-1/ac-2 and Rust lifecycle event behavior for ac-3."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-19T06:38:50.002Z
  - _ulid: 01KXWHSQDF5X0DJWCHFYKKDD34
    content: "Evidence clarification: the Windows report does not say the ordinary lightbox is blank on
      initial open. It says the image disappears only after a fullscreen curation swipe, followed by
      a soft-lock and no filesystem move. Treat that as @curation-gesture-decisions-recovery
      evidence, not proof of this ordinary-open regression. Keep this task reproduction-first; do
      not modify ordinary rendering without separate evidence."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-19T06:42:42.735Z
  - _ulid: 01KXWJ2ZY08ZJ5ZZ72ZFBQBW7G
    content: "Source comparison found no ordinary gallery/Lightbox/media route change from 2.0.1 to
      2.0.2. Explicit shutdown has no normal-open path. Remaining concrete ordinary-lightbox risks
      are pre-existing: still images have no onError UI and invalid numeric-ID selection returns
      null; image identity uses id without directory/library. Local sample has 10 distinct IDs and
      no collisions, and sampled original WebP returns valid bytes. Do not attribute the Windows
      post-swipe report to this path."
    supersedes: null
