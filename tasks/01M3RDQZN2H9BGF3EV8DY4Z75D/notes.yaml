      /tmp/dmc-create-simple from main171eb7a. Existing UI/controller agents are reused with
      explicit surface ownership. Root will inspect actual edited execution prompt with disposable
      synthetic client without real generation, lifecycle/source boundaries, responsive rendering
      and focused checks. No third-party code copied and no new backend dependency."
