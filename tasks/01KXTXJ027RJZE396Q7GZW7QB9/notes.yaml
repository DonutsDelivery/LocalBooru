notes:
  - _ulid: 01KXTXJ0273RD80EJDFMABB80K
    content: >-
      Implementation notes (auto-generated from spec):



      Acceptance Criteria:

      - ac-1: Given LocalBooru has active transcodes and add-on processes, when the user chooses
      Quit from the title bar or Settings, then all managed background process trees stop before the
      application exits

      - ac-2: Given LocalBooru has active transcodes and add-on processes, when the user chooses
      Quit from the system tray, then all managed background process trees stop before the
      application exits

      - ac-3: Given LocalBooru is running with active backend services or add-ons, when the user
      closes or minimizes the window without choosing Quit, then the application continues running
      in the background with those services available
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T15:29:43.495Z
  - _ulid: 01KXTXKVNVXGS06X4S672X514R
    content: "Approach: add a shared AppState async shutdown boundary, make AddonManager::stop_all await
      every tracked child lock and process exit, and route IPC/tray Quit through it while leaving
      close-to-tray untouched. Edge case: a contended child mutex must not cause cleanup to skip a
      Python process. Test plan: real child-process contention test for ac-1/ac-2 and existing
      close/minimize behavioral coverage for ac-3."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T15:30:44.539Z
  - _ulid: 01KXTY4JQVP0H4D808RTMQVB6N
    content: "Implemented shared explicit-exit cleanup: AppState stops transcodes and awaits
      AddonManager shutdown; title/Settings IPC and tray Quit now share commands::quit_app. Addon
      shutdown detaches handles before awaits, waits through mutex contention, tree-kills, and reaps
      children. Normal close remains hide-to-tray and has AC coverage."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T15:39:52.443Z
  - _ulid: 01KXV08Y7YVTQJA0ZWF5R1XV3W
    content: "Review fix pass: added single-flight cleanup so concurrent Quit requests cannot exit
      early; delayed the quit flag until cleanup completes; gated new/in-flight addon and transcode
      starts; routed native user-requested app exits through the same cleanup. Added 5-second child
      wait timeout. Full verification: 129 Rust tests and 52 frontend tests pass; cargo check passes
      with 5 pre-existing optical-flow dead-code warnings. kspec validate remains blocked by 130
      pre-existing legacy schema errors."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T16:17:12.446Z
  - _ulid: 01KXV0WRXD2JCNV69FRH9SGREF
    content: "Final verification after review fixes: 130 Rust tests and 52 frontend tests pass; cargo
      check and formatting pass; independent final review reports no findings. GUI smoke was not run
      because the currently running LocalBooru instance uses the same fixed port/single-instance
      endpoint and should not be interrupted; the Windows Wine UI remains blocked by WebView2 as
