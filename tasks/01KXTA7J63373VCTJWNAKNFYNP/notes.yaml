notes:
  - _ulid: 01KXTA7J62CZMS9RVTMZ5MGNPZ
    content: >-
      Implementation notes (auto-generated from spec):


      Auto Tagger reports model execution from completed prediction evidence and distinguishes GPU
      inference from CPU preparation and fallback work.



      Acceptance Criteria:

      - ac-1: Given the tagger model has loaded but no prediction has completed, when runtime status
      is viewed, then execution is reported as unverified and provider registration is not presented
      as observed GPU execution

      - ac-2: Given a prediction completes with observable model execution evidence, when runtime
      status is viewed, then CUDA-only, CPU-only, mixed, or unknown execution is reported according
      to the providers that processed the model

      - ac-3: Given CUDA execution is explicitly requested, when the complete model cannot execute
      on CUDA, then the add-on records the CUDA failure, performs a CPU fallback prediction when
      possible, and does not report CUDA execution

      - ac-4: Given a prediction completes, when diagnostic status is recorded, then image
      preparation, model inference, result processing, and total durations are reported separately

      - ac-5: Given a prediction is running, when runtime health is requested, then health remains
      responsive without loading a duplicate model process

      - ac-6: Given runtime diagnostics are displayed, when the user reviews Auto Tagger settings,
      then requested device, runtime availability, session registration, observed execution, timing
      evidence, and fallback warnings are visibly distinguished
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T09:51:58.658Z
  - _ulid: 01KXTA957WFPEWMKK8K9BMK32D
    content: "Approach: stop treating session provider order as execution evidence; use first-inference
      ORT profiling for observed provider counts/timings, strict no-CPU-node fallback for explicit
      CUDA, fresh CPU session fallback, contiguous preprocessing, bounded synchronous prediction,
      and a UI that separates requested/available/registered/observed states. Tests: synthetic
      profiles and fake sessions for ACs 1-5, pure frontend formatter coverage for AC-6, plus
      real-model profile smoke. Branch HEAD exactly matches origin/release/2.0.1; rebase was
      unnecessary and blocked only by pre-existing user changes."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T09:52:50.940Z
  - _ulid: 01KXTB77XVSYAWNZZ68QG7PTSV
    content: "Hardware discovery: strict session.disable_cpu_ep_fallback is incompatible with the
      shipped WD graphs because ORT intentionally assigns inexpensive shape/control nodes to CPU. A
      real vit-v3 profile showed 468 CUDA node events / 296.471 ms and 170 CPU events / 0.585 ms.
      Revised AC-3 to require observed CUDA evidence rather than zero CPU nodes; explicit CUDA keeps
      CUDA+CPU registration, reports mixed truthfully, and treats zero CUDA events as CPU fallback."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T10:09:16.731Z
  - _ulid: 01KXTCQ0T4E7612AWHSVVRF2PX
    content: "Verification: 13 Auto Tagger Python tests, all 56 frontend tests, frontend production
      build, targeted ESLint, 12 focused Rust add-on tests, cargo fmt --check, and all 124 Rust
      library tests pass. Real EVA02 CUDA smoke observed mixed execution: 1360 CUDA events /
      1057.570 ms and 560 CPU events / 13.973 ms; execution was unverified before prediction and no
      temporary profile remained. Clippy -D warnings is blocked by unrelated existing repository
      warnings. Windows cross-check reached native C compilation but this Linux host lacks MSVC
      lib.exe. Full kspec validation is blocked by 130 pre-existing schema errors in legacy
      android/core records; this task's spec and six ACs load correctly."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-18T10:35:22.308Z
  - _ulid: 01KXTD7MADS3T8NBSX9Y2NY2S0
    content: Independent review found that first-run CUDA failure in auto mode returned HTTP 500 instead
      of using the documented CPU fallback. Fixed the fallback condition for both auto and explicit
      CUDA and parameterized the behavioral test; 14 focused Python tests now pass.
    supersedes: null
