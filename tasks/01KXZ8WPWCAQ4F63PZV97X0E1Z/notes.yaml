notes:
  - _ulid: 01KXZ8WPWCPAG53RDVPRSQTF52
    content: >-
      Implementation notes (auto-generated from spec):


      Local container release builds immediately report whether they are blocked, failed before
      launch, or have entered a real build stage.



      Acceptance Criteria:

      - ac-1: Given a local container release build has not reached a container build or
      artifact-build stage, when validation, source resolution, runtime discovery, or another
      preflight step fails, then the request reports an early failure and never reports that the
      build started

      - ac-2: Given the shared lock is acquired and all required preflight checks pass, when the
      container image build or artifact-build process is invoked for the resolved source revision,
      then the request reports that the build started with its platform and immutable source
      revision
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T08:04:46.604Z
  - _ulid: 01KXZ8YJPBHC1JDXRJ75J396BR
    content: "Approach: reuse the existing shared flock, add post-acquisition owner metadata and stable
      STARTED/LOCKED/FAILED status output shared by Windows and Linux launchers. Edge cases: stale
      metadata, early preflight failure, image rebuild versus artifact run, and explicit opt-in
      waiting. Tests use temporary state roots and stub container commands to prove all three
      outcomes and immutable source forwarding."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T08:05:47.851Z
  - _ulid: 01KXZ95C1XY8A5ZNQBQSYA89XK
    content: Implemented immediate nonblocking LOCKED reporting with holder metadata, early FAILED
      reporting, and STARTED only at real container image/artifact invocation. Both Windows and
      Linux forward the resolved immutable SHA. Behavioral shell tests cover all three ACs and pass;
      commit 4da6187e.
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T08:09:30.429Z
