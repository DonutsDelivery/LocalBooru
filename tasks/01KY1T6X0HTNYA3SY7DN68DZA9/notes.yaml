notes:
  - _ulid: 01KY1T6X0HG5GDHKH09VBGZ701
    content: >-
      Implementation notes (auto-generated from spec):


      Grouped folder navigation follows the selected library and directory scope without retaining
      an incompatible folder path.



      Acceptance Criteria:

      - ac-scope-change: Given grouped folder mode is open inside a folder, when the user selects a
      different directory, a different library, or All directories, then the old folder path is
      cleared, grouped mode remains active, and the selected scope's folder catalog is shown

      - ac-same-scope: Given grouped folder mode is open inside a folder, when the user changes a
      filter without changing library or directory scope, then the current folder path remains
      selected
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-21T07:45:55.217Z
  - _ulid: 01KY1T81QHFT5FX2Z8S2MK9FJ2
    content: "Approach: preserve group=folders but clear folder when library/directory scope changes;
      test same-scope preservation and all scope transitions through a pure gallery-state helper."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-21T07:46:32.818Z
  - _ulid: 01KY1YEYV834SXB2MGESCNPSAK
    content: "Implemented scope-safe grouped navigation: changing directory/library/All clears
      incompatible folder while retaining group=folders; same-scope filter changes preserve folder.
      Authoritative grouped catalog refresh failures now retry with bounded backoff. Gallery
      behavioral tests and full frontend suite pass."
    supersedes: null
    author: DonutsDelivery
