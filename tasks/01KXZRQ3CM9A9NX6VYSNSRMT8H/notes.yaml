notes:
  - _ulid: 01KXZRQ3CM47C6C388TQ88FKSM
    content: >-
      Implementation notes (auto-generated from spec):


      Selected gallery items can choose a destination and start a batch move without crashing the
      interface.



      Acceptance Criteria:

      - ac-directory-envelope: Given the directory service returns its standard directory-list
      response, when the user opens Move for selected gallery items, then the destination list is
      rendered and the application remains usable

      - ac-fetch-failure: Given destination directories cannot be loaded, when the user opens Move,
      then the failure is reported without opening a broken dialog or replacing the interface with a
      black screen
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T12:41:20.020Z
  - _ulid: 01KXZSBP45T2SNC32ZNN3TEFB4
    content: "The directories API returns { directories: [...] }, but both gallery selection handlers
      stored the envelope and rendered moveDirectories.map, causing the React black-screen
      exception. Both handlers now validate/extract the array and report failed or malformed
      responses without opening the modal. Added both AC tests; full frontend suite passed 76/76 and
      production build passed."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-20T12:52:34.566Z
