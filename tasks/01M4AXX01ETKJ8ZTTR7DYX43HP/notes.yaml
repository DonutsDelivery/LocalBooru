  - _ulid: 01M4AZRF5HNG47RSYYMK6B90VK
    content: "Relative-layout runtime followup completed: exact position objects {left_of,above}
      reference existing distinct character labels, with independent axis DAG validation and
      arbitrary record order; legacy string families retained. Position-only bijection solver uses
      center gaps greater than 0.25 of smaller bbox width/height, relation-support/all-different
      propagation and deterministic smallest-domain search. At most two solutions and a shared
      100,000 search/propagation work budget; zero/multiple solutions or budget exhaustion fail
      before any CLIP encoding/sampling throughout the batch. One-record plans now rejected rather
      than silently ignored, matching backend/adapter; empty plans preserve legacy single-face
      controls and strict-single flag. Twenty synthetic runtime/installer tests pass including
      above/left chains, uneven four-person family, six-person arrangement, 16-person chain,
      shuffled detections, near ties, later-batch ambiguity, exhaustive independent 40-case
      bijection oracle and scale/translation invariance. Root approved geometric policy and owns
      final integration/review."
