notes:
  - _ulid: 01KXPM75Q0X8KP8KGDDWKPNQX1
    content: "Approach: define a versioned Pydantic protocol plus a framework-independent
      ProcessingSession, bounded segment store, registry, and deterministic fake producer under
      addons/svp. Reuse the addon's existing sidecar boundary; do not alter the legacy HLS pipeline
      yet. Edge cases: stale and skipped generations, repeated stop/pause/resume, capacity
      backpressure, segment cleanup, timestamp regression, excessive A/V drift, and rapid seeks.
      Test plan: annotated unittest coverage for all three @svp-bounded-stream ACs plus protocol
      validation and idempotent cleanup. Branch was created from current v2 HEAD; rebase was
      intentionally skipped because the working tree contains unrelated active-task changes that
      must not be stashed or rewritten."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-16T23:29:33.920Z
  - _ulid: 01KXPMFJG7EXTCSP5X6V3TMWY5
    content: "Implemented the first protocol slice: versioned Pydantic
      open/command/seek/metadata/segment/event models; generation-owned ProcessingSession and
      registry; hard byte/duration backpressure; segment acknowledgement and deletion; transactional
      seek revocation; timestamp and A/V drift rejection; idempotent pause/resume/stop; ordered
      generation-tagged events; and a deterministic bounded fake producer. Added six behavioral
      unittest cases with AC annotations. Validation: compileall passes and all six tests pass. Full
      kspec validate remains blocked by 130 pre-existing malformed legacy records outside this
      task."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-16T23:34:09.159Z
  - _ulid: 01KXPP1NKQVC640YA00ATJDF41
    content: "Review hardening completed. Added generation-owned init-segment readiness; strict
      finite/extra-forbidden wire models and event payload validation; actual file-size and
      ownership checks; bounded event replay with cursor expiry; contiguous source timeline
      enforcement; acknowledged-position fail-open reporting; terminal-state and non-seekable
      guards; generation-scoped stop; and producer cursor/filename isolation. Expanded behavioral
      coverage from 6 to 13 passing tests. Deliberately did not expose HTTP routes: the
      deterministic producer emits test-only placeholder bytes rather than valid fMP4, app.py still
      owns the legacy HLS lifecycle, and packaged addon deployment currently ships only app.py.
      Wiring those together now would expose invalid media and create competing lifecycle owners;
      HTTP/process integration remains for the dependent real fMP4/MSE task."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-17T00:01:30.743Z
