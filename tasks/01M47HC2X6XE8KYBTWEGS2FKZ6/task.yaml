title: Creator discovery sidebar and selective offline community replication
type: task
description: "Approved product direction: hub is creator discovery catalog. Sidebar searchable
  creator list, available/following/offline/all views, same masonry/lightbox, stable creator
  selection. Users explicitly sync individual creator collections or all creators with bounded
  storage, progress, offline local media browsing and verified peer serving. Publisher ownership
  remains Discord-linked internal account; withdrawals stop community delivery. Preserve current
  Bunny fallback during migration; do not retire bridge or storage until functional replacement
  verified. Integrate main, deploy protocol support, rebuild installed app and verify."
