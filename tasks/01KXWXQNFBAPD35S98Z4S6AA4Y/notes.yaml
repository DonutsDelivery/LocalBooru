    content: Implemented eight Tauri resize directions with behavior tests, body-portaled hit regions
      above overlays, tri-state/debounced native maximize synchronization, and
      browser/mobile/maximized gating. Manual Wayland testing exposed native/custom overlap at
      corners; moved custom hit regions inward beyond Tauri's native 5px border so diagonal drags
      have a single owner. Frontend 67/67, production build, and diff check pass.
