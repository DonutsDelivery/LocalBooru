notes:
  - _ulid: 01KY4N31804CYSVKD1Y8W2R2X5
    content: >-
      Implementation notes (auto-generated from spec):


      Auto Tagger predictions are saved completely to the intended image while preserving manual
      curation and isolating images that reuse local identifiers.



      Acceptance Criteria:

      - ac-composite-isolation: Given images in different libraries or directories share the same
      local identifier, when one image is auto-tagged, then only the selected library and directory
      image receives the predicted tags

      - ac-manual-preservation: Given an image has manually assigned tags and an earlier automatic
      tag set, when a new prediction is saved, then manual tags remain and the automatic tag set
      exactly matches the completed prediction

      - ac-atomic-write: Given saving a multi-tag prediction fails before every automatic tag can be
      saved, when the failure is reported, then the prior complete automatic tag set remains visible
      and no partial new set is published

      - ac-partial-recovery: Given an earlier failed task left one automatic tag and retains a
      retryable task record, when the task is retried successfully, then the partial set is replaced
      by the complete current prediction without changing manual tags
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-22T10:14:08.897Z
  - _ulid: 01KY4N4JFHBBR0ZVZ0WYZMFZT4
    content: "Confirmed root cause: the first per-directory association commits, then the same
      directory-local image ID is inserted into legacy main image_tags and fails its foreign key (or
      can collide with an unrelated legacy image). Approach: normalize the whole prediction, resolve
      explicit library/directory/image ownership, and replace automatic associations atomically
      while preserving manual tags. Tests cover complete sets, cross-directory IDs, rollback, and
      recovery."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-22T10:14:59.313Z
  - _ulid: 01KY4PD6T3CPC4438Z4Z9ACQVW
    content: "Implemented authoritative composite-identity persistence: complete normalized predictions
      replace only automatic tags atomically in the directory database, manual tags remain, legacy
      main image associations are never written, and affected global post counts are recalculated.
      Behavioral regressions cover 3+ tags/deduplication, colliding directory IDs, historical
      one-tag repair, manual preservation, and rollback."
    supersedes: null
    author: DonutsDelivery
    created_at: 2026-07-22T10:37:10.851Z
