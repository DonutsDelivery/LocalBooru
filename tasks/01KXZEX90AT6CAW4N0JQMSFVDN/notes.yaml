  - _ulid: 01KXZFCACNQGDTYRWYVZQ9Q094
    content: "Approach: add an explicitly AGPL-3.0 addons/lada package that is excluded from the MIT
      base bundle, with a stable JSON control protocol, three-slot shared-memory lease pool, pinned
      upstream/model manifests, probe/serve CLI, and deterministic package-manifest builder. Reuse
      LADA FrameRestorer through a narrow lazy-loaded adapter so tests run without Torch/LADA. Edge
      cases: wrong protocol/revision, missing or bad model hashes, CPU-only backend, invalid paths,
      stale generations, pool exhaustion, duplicate releases, seek replacement, worker errors/EOS,
      parent/socket loss, and archive/source mismatch. Test plan: behavioral pytest coverage for
      license/source metadata, base-package exclusion manifest, binary/source hash matching, probe
      state, protocol generations, lease backpressure, and packaging output; annotate each
      applicable @lada-license-provenance AC."
    supersedes: null
    author: "@claude"
    created_at: 2026-07-20T09:58:09.557Z
  - _ulid: 01KXZG3C64NYR7N97ZSQFXEY1N
    content: "Implemented the AGPL add-on package under addons/lada: pinned upstream LADA source/uv
      lock, exact model source/hash/size manifest, CUDA/XPU package metadata, lazy FrameRestorer
      adapter, protocol v1, three-slot memfd-backed pool, authenticated seqpacket server,
      probe/serve/build-manifest CLI, reproducible bundle script, full license/notices, and
      behavioral tests. Verification: 12 pytest tests pass; Ruff passes; compileall and bash -n
      pass; sdist/wheel build and wheel license/source inspection pass. Real multi-GB CUDA/XPU/model
      bundle builds and external publication remain release-stage work and are intentionally not
      run/published in this task."
    supersedes: null
    author: "@claude"
    created_at: 2026-07-20T10:10:45.060Z
