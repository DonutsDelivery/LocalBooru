      closing only the producer's old handles; enforce nonce/protocol hello before commands; surface
      LADA Exception/ErrorMarker values; stage Corresponding Source from tracked git archives;
      narrow base-artifact detection to exact LADA payloads. Tests will reproduce old-FD
      immutability, unauthenticated open rejection, ErrorMarker conversion, clean source staging,
      and unrelated model allowance. The Add-on Manager disclosure AC annotation moves to the later
      behavioral frontend test rather than claiming metadata loading proves UI behavior."
