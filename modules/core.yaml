  - _ulid: 01KXNWP134SVKPP6R0QQ4VYDAJ
    slugs:
      - curation-game
    title: Curation Game
    type: feature
    description: Installable built-in gallery mode for rapidly keeping or reversibly discarding media
      from the current filtered and sorted view, with one-step undo and optional daily or weekly
      goals.
    status:
      maturity: draft
      implementation: in_progress
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: Curation Game is not installed
        id: ac-1
        then: the feature installs without Python, a virtual environment, a port, or a sidecar process and
          its launcher and settings become available immediately
        when: the user installs it from Addons
      - given: the gallery has any combination of library, directory, folder, tags, rating, age, timeframe,
          filename, resolution, orientation, duration, and sort filters
        id: ac-2
        then: the run snapshots those filters and sort, supports all visible directories or mounted
          libraries when selected, and starts with the first non-favorite in masonry order
        when: the user starts Curation Game
      - given: a non-favorited candidate is current
        id: ac-3
        then: the item is idempotently favorited, removed from the candidate queue, counted once, and the
          next candidate is shown
        when: the user chooses Keep
      - given: a candidate is current
        id: ac-4
        then: all active file references move to the configured Prune dumpster convention while database
          identity, tags, and thumbnail metadata remain available for undo
        when: the user chooses Discard
      - given: the latest successful action was Keep or Discard
        id: ac-5
        then: that action and its goal count are reversed and the same item is shown again without
          overwriting filesystem collisions
        when: the user chooses Undo
      - given: more than one query page matches the run
        id: ac-6
        then: the queue refills without offset skips, duplicates, or reintroducing favorited or discarded
          items
        when: the user curates beyond the first 50 items
      - given: no matching non-favorites remain
        id: ac-7
        then: the UI says no more images are left to curate and offers to unfavorite all currently matching
          favorites and restart when such favorites exist
        when: the run completes
      - given: the user configures an optional daily or weekly target
        id: ac-8
        then: the current client persists and displays progress with Keep and Discard incrementing and Undo
          decrementing the original local-day bucket
        when: Keep, Discard, or Undo succeeds
      - given: Curation Game is active
        id: ac-9
        then: large Keep and Discard buttons, a smaller Undo button, and curation keyboard shortcuts are
          available while normal favorite, permanent delete, navigation, and video seek controls
          cannot bypass a decision
        when: the user interacts with the lightbox
      - given: Curation Game is inactive or uninstalled
        id: ac-10
        then: existing behavior remains available and curation data is not altered by uninstalling the
          add-on
        when: the user uses the gallery, lightbox, favorites, deletion, Prune, sorting, or pagination
    priority: high
    tags:
      - gallery
      - addons
      - curation
    requirements:
      - _ulid: 01KXWFPV1TGK084RXYRG9Z7XD2
        slugs:
          - curation-gesture-decisions-recovery
        title: Curation Gesture Decisions and Recovery
        type: requirement
        description: Curation fullscreen input commits at most one explicit decision, leaves ordinary
          Lightbox swipes non-destructive, and keeps candidate discovery recoverable when refilling
          fails.
        status:
          maturity: draft
          implementation: in_progress
        depends_on: []
        implements: []
        relates_to:
          - "@curation-game"
        tests: []
        traits: []
        acceptance_criteria:
          - given: Curation Game is active at default zoom with one touch on the media surface
            id: ac-1
            then: the ordinary Lightbox horizontal-swipe behavior is used and no Keep or Discard decision is
              committed
            when: a horizontally dominant swipe exceeds 50 pixels
          - given: Curation Game is active
            id: ac-2
            then: no curation decision is committed
            when: a gesture is a pinch, begins on a control, occurs while zoomed or panning, is vertically
              dominant, or does not exceed the threshold
          - given: a curation decision is already mutating, advancing the queue, or refilling
            id: ac-3
            then: the current candidate is committed at most once
            when: touch, keyboard, or button input requests another decision
          - given: the current candidate was successfully kept or discarded and the queue becomes empty
            id: ac-4
            then: the committed decision is not repeated and the UI shows loading or visible Retry and Exit
              recovery controls instead of a black unrendered state
            when: candidate refill is pending or fails
          - given: candidate refill previously failed after a successful decision
            id: ac-5
            then: Retry resumes discovery with the existing query and progress without replaying the decision,
              while Exit returns to a refreshed gallery
            when: the user retries or exits
          - given: Curation Game is inactive
            id: ac-6
            then: existing sidebar, pinch, zoom, pan, navigation, and video behavior remains unchanged
            when: the same touch gestures are used in the lightbox
        priority: high
        tags: []
        created: 2026-07-19T06:06:11.002Z
