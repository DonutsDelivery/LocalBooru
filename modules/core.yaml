            id: ac-apply-source-transition
            then: the committed source replaces preview ownership before preview cleanup and cleanup cannot
              delay or reverse the successful transition
            when: the backend commits the adjusted source
          - given: an obsolete preview request fails after the committed image becomes current
            id: ac-source-owned-error
            then: it cannot replace the current image with an error state
            when: the stale media error arrives
          - given: a supported PNG or JPEG image is writable on Windows
            id: ac-apply-decode
            then: the exact returned media URL is immediately servable, decodable, and remains adjusted after
