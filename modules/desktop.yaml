        slugs:
          - desktop-launcher-continuity
        title: Desktop launcher continuity
        type: requirement
        description: Desktop activation preserves and reveals an existing LocalBooru instance instead of
          replacing it, while retaining normal launch behavior when no instance is running.
        status:
          maturity: draft
          implementation: in_progress
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: a recognized development instance is running with its window hidden or minimized
            id: ac-1
            then: the running process remains alive and its existing window is restored and focused
            when: the normal desktop launcher is activated
          - given: a recognized development instance is running
            id: ac-2
            then: the file path is delivered unchanged to the running instance
            when: the normal desktop launcher receives a file path argument
          - given: a recognized development instance is running while installed assets are unavailable or build
              preparation is busy
            id: ac-3
            then: the existing instance is contacted without waiting for installed-build preparation
            when: the normal desktop launcher is activated
          - given: no recognized development instance is running
            id: ac-4
            then: the installed application launches with the supplied arguments
            when: the normal desktop launcher is activated
