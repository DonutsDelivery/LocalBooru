          - _ulid: 01KXZEX8TK1SR6XVC9N94HXV4F
            slugs:
              - lada-bounded-frame-transport
            title: Bounded LADA Frame Transport
            type: requirement
            description: >
              Deliver restored frames from the sidecar to GStreamer with bounded resources, source
              timestamps, and generation-safe seeking.
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits: []
            acceptance_criteria:
              - given: |
                  LADA playback is active, paused, or consumed slower than frames are restored
                id: ac-bounded-backpressure
                then: >
                  the sidecar stops advancing output until a buffer is released and no more than
                  three LocalBooru frame buffers are in flight
                when: |
                  all shared frame buffers are leased to LocalBooru
              - given: |
                  the sidecar produces restored frames for a local video
                id: ac-source-timestamps
                then: >
                  each frame uses its source presentation timestamp and duration against the
                  original audio and pipeline clock without fabricated wall-clock timing
                when: |
                  GStreamer presents those frames
              - given: |
                  restored playback has pending or leased frames
                id: ac-seek-generation
                then: >
                  only frames from the final accepted seek generation can become visible and earlier
                  frames, end markers, and errors cannot reclaim playback
                when: |
                  one or more seeks occur
            tags: []
            created: 2026-07-20T09:49:56.435Z
            notes: []
          - _ulid: 01KXZEX8V1WHKBFRMTJX16A4BQ
            slugs:
              - lada-playback-ownership
            title: LADA GStreamer Playback Ownership
            type: requirement
            description: >
              Present restored video through the standard WebKit/GStreamer player while retaining
              exactly one visible and audible playback owner across preparation, navigation,
              failure, and shutdown.
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits: []
            acceptance_criteria:
              - given: >
                  original local video playback has position and play or pause intent and LADA is
                  ready
                id: ac-first-frame-handoff
                then: >
                  LocalBooru preserves the playback intent, stops competing producers, keeps
                  original video available during preparation, and switches to restored output only
                  after the matching generation presents its first valid frame
                when: |
                  restoration is enabled
              - given: |
                  LADA restored video is selected
                id: ac-original-audio-clock
                then: >
                  the original GStreamer audio branch and pipeline clock remain authoritative and
                  the restored video does not create duplicate audio or change media duration
                when: |
                  playback, pause, rate, track selection, or seeking changes
              - given: >
                  LADA startup is cancelled, times out, crashes, rejects a seek, or fails during
                  playback
                id: ac-fail-open
                then: >
                  exactly one original video and audio owner continues at the preserved safe
                  position and the user sees the restoration fallback reason
                when: |
                  recovery completes
              - given: |
                  LADA is preparing or playing
                id: ac-clean-close
                then: >
                  the active generation is invalidated and no LADA process, child worker, socket,
                  shared mapping, or unreleased frame lease remains
                when: >
                  the user disables it, navigates, casts, closes the player, uninstalls the add-on,
                  or quits LocalBooru
            tags: []
            created: 2026-07-20T09:49:56.449Z
            notes: []
