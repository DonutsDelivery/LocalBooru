          - given: |
              a supported Linux desktop has a compatible accelerator and no LADA runtime installed
            id: ac-one-click-use
            then: >
              LocalBooru obtains and validates the required add-on components and begins restored
              playback without terminal commands, system Python setup, model selection, executable
              paths, or a separate manager
            when: |
              the user installs LADA from Add-on Manager and enables restoration in the video player
          - given: |
              LocalBooru is newly installed or the LADA add-on is not ready
            id: ac-disabled-default
            then: |
              the original playback path is used and LADA restoration remains disabled
            when: |
              the user opens a video
