  - _ulid: 01KXAGJJWXHE735HQ312QKYGHV
    slugs:
      - addon-settings
    title: Add-on Settings and Auto Tagger Configuration
    type: feature
    description: Provide a dedicated Add-on Settings surface for installed configurable sidecars,
      preserve core Video and directory-scoped controls, and make Auto Tagger model/provider
      selection observable and configurable through the Rust/Tauri application.
    status:
      maturity: draft
      implementation: in_progress
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: configurable add-ons are installed
        id: ac-1
        then: the app lists only installed add-ons with supported settings panels and renders the selected
          panel
        when: the user opens Add-on Settings
      - given: Whisper, Cast, SVP, and Age Detector are installed
        id: ac-2
        then: their add-on-specific controls are not duplicated under General or Video, while built-in
          FFmpeg interpolation remains under Video and directory-specific actions remain under
          Directories
        when: settings navigation is rendered
      - given: the Auto Tagger add-on is configured
        id: ac-3
        then: the app persists the model and thresholds, obtains both required model files, launches the
          sidecar with that selection, and reports requested, available, and active ONNX providers
          accurately
        when: the user selects a supported model and device preference
      - given: the Tauri v2 application is packaged
        id: ac-4
        then: it uses the supported Tauri path without Electron metadata, dependencies, or packaging scripts
        when: the release build runs
    priority: high
    tags:
      - addons
      - settings
      - desktop
    created: 2026-07-12T06:35:00.381Z
    notes: []
  - _ulid: 01KXPM0TN30TDXXDSAZFTJRX3K
    slugs:
      - desktop-svp-video
    title: Cross-platform SVP video playback
    type: feature
    description: Desktop LocalBooru connects its standard video player to the graph selected by the
      user's installed SVP Manager on Linux, Windows, and Apple Silicon macOS; LocalBooru does not
      choose or generate interpolation behavior.
    depends_on: []
    implements: []
    relates_to:
      - "@frame-interpolation"
    tests: []
    traits: []
    acceptance_criteria:
      - given: SVP is installed and enabled on a supported Linux, Windows, or Apple Silicon macOS desktop
        id: ac-supported-desktops
        then: LocalBooru presents SVP-interpolated playback through the standard video player and controls
        when: the user opens a compatible video
      - given: SVP playback cannot start or becomes unavailable
        id: ac-unavailable-fallback
        then: LocalBooru returns to one direct playback source at the same safe playback position and
          reports the SVP failure
        when: the user opens or continues the video
    tags: []
    requirements:
      - _ulid: 01KXPM0WPRYRP0YSMT9XZN3A1Z
        slugs:
          - svp-single-player
        title: Single video playback owner
        type: requirement
        description: SVP transitions preserve one standard video player and prevent superseded playback from
          producing picture or sound.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: a video is open in the standard player
            id: ac-existing-player
            then: the same player and its existing controls remain the user-facing playback surface
            when: SVP is enabled, disabled, restarted, or reconfigured
          - given: multiple SVP state changes or seeks occur before a transition finishes
            id: ac-final-transition-owner
            then: only the final requested playback state can resume and no superseded source produces audio or
              video
            when: the final transition becomes ready
          - given: the source reaches its end during an SVP transition
            id: ac-ended-transition
            then: playback remains ended and does not restart as an additional audible source
            when: the transition completes
        tags: []
        created: 2026-07-16T23:26:08.088Z
        notes: []
      - _ulid: 01KXPM0Z6HQQ4T5E0AG8446E94
        slugs:
          - svp-bounded-stream
        title: Bounded and synchronized SVP streaming
        type: requirement
        description: Windows and macOS interpolation remains seekable and synchronized without producing
          unbounded buffered media.
        status:
          maturity: draft
          implementation: in_progress
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: SVP playback is active or paused for an extended period
            id: ac-bounded-buffer
            then: processing stops advancing until capacity is available and retained media remains within the
              configured byte and duration limits
            when: processed media reaches the configured buffer limit
          - given: SVP playback is active
            id: ac-transactional-seek
            then: only the final requested position resumes and media from older requests cannot alter playback
            when: the user seeks repeatedly to new absolute positions
          - given: a video contains audio and is played through SVP
            id: ac-av-timeline
            then: audio and interpolated video retain the source duration, monotonic timing, and the accepted
              synchronization tolerance
            when: playback starts, continues, or resumes after a seek
        tags: []
        created: 2026-07-16T23:26:10.641Z
        notes: []
      - _ulid: 01KXPM11MQPPDWEB5P0GM0ZM9Z
        slugs:
          - svp-platform-routing
        title: Platform-specific SVP connection
        type: requirement
        description: Each supported desktop connects the standard video player to the user installed SVP
          using the platform supported integration path.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: the packaged Linux app has a working user-installed SVP setup
            id: ac-linux-route
            then: the existing Linux media pipeline applies the Manager-selected interpolation graph
            when: SVP playback starts
          - given: the packaged Windows app has a working user-installed SVP setup
            id: ac-windows-route
            then: the standard video player receives bounded locally processed media and responds to the user's
              SVP Manager state
            when: SVP playback starts
          - given: the packaged Apple Silicon macOS app has a working user-installed SVP setup
            id: ac-macos-route
            then: the standard video player receives bounded locally processed media and responds to the user's
              SVP Manager state
            when: SVP playback starts
          - given: SVP playback is requested from a browser, mobile app, or remote client
            id: ac-nondesktop-route
            then: the existing remote streaming behavior remains available without selecting a desktop-only
              integration
            when: the request is supported
        tags: []
        created: 2026-07-16T23:26:13.143Z
        notes: []
      - _ulid: 01KXPM14S2J3DVRD9Q0RRNPQX5
        slugs:
          - svp-manager-transitions
        title: Reliable SVP Manager transitions
        type: requirement
        description: Manager-driven graph changes are private, deterministic, and resilient to duplicate or
          competing control activity.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: the active Manager repeats an identical add or remove request
            id: ac-idempotent-changes
            then: playback is not restarted unnecessarily
            when: LocalBooru applies the request
          - given: the active Manager changes graph contents at an existing location
            id: ac-changed-graph
            then: exactly one replacement graph becomes active using an immutable copy of the final contents
            when: LocalBooru applies the change
          - given: one Manager process currently controls LocalBooru
            id: ac-controller-ownership
            then: the competing process is rejected until the active controller disconnects
            when: a different Manager process attempts to take control
          - given: SVP Manager interpolation and its configured OSD are enabled
            id: ac-measured-acceptance
            then: the genuine Manager OSD is visible where supported and measured presented cadence matches the
              selected interpolation target
            when: platform acceptance playback is performed
        tags: []
        created: 2026-07-16T23:26:16.354Z
        notes: []
