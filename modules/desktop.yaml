requirements:
  - _ulid: 01KXZ8WBKRATXEJJGTV9QSQ2MS
    slugs:
      - truthful-container-build-startup
    title: Truthful Container Build Startup
    type: requirement
    description: Local container release builds immediately report whether they are blocked, failed
      before launch, or have entered a real build stage.
    status:
      maturity: draft
      implementation: in_progress
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: a local container release build has not reached a container build or artifact-build stage
        id: ac-1
        then: the request reports an early failure and never reports that the build started
        when: validation, source resolution, runtime discovery, or another preflight step fails
      - given: the shared lock is acquired and all required preflight checks pass
        id: ac-2
        then: the request reports that the build started with its platform and immutable source revision
        when: the container image build or artifact-build process is invoked for the resolved source
          revision
      - given: another LocalBooru build or cleanup owns the shared build lock
        id: ac-locked
        then: the request immediately reports that it is locked, identifies the active owner when known, and
          exits without claiming that a build started
        when: a local container release build is requested without an explicit wait
    priority: high
    tags: []
    created: 2026-07-20T08:04:35.064Z
