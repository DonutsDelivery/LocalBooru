      - _ulid: 01KXPM11MQPPDWEB5P0GM0ZM9Z
        slugs:
          - svp-platform-routing
        title: Platform-specific SVP connection
        type: requirement
        description: Each supported desktop connects the standard video player to the user's installed SVP
          Manager through the platform control and attachment transports; build verification is
          distinct from native playback acceptance.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: the packaged Linux app has a working user-installed SVP setup
            id: ac-linux-route
            then: the existing Linux media pipeline applies the Manager-selected interpolation graph
            when: SVP playback starts
          - given: the packaged Windows app has a working user-installed SVP setup
            id: ac-windows-route
            then: the standard video player receives bounded output from the exact active Manager-generated
              graph through the Windows integration
            when: SVP playback starts
          - given: the packaged Apple Silicon macOS app has a working user-installed SVP setup
            id: ac-macos-route
            then: the standard video player receives bounded output from the exact active Manager-generated
              graph through the macOS integration
            when: SVP playback starts
          - given: SVP playback is requested from a browser, mobile app, or remote client
            id: ac-nondesktop-route
            then: the existing remote streaming behavior remains available without selecting a desktop-only
              integration
            when: the request is supported
          - given: the desktop player requests an SVP processing session
            id: ac-opaque-session-request
            then: the trusted desktop backend supplies the active Manager graph revision and the player cannot
              select a graph path or interpolation mode
            when: the request crosses the application API
          - given: Windows Docker or macOS CI completes without a native machine running a real installed SVP
              setup
            id: ac-verification-label
            then: the result is identified as protocol, compile, or package verification and native SVP playback
              acceptance remains open
            when: the result is reported
