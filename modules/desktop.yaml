  - _ulid: 01KY0D88DAD65C7KHV2DQ84YZE
    slugs:
      - safe-development-startup
    title: Safe development startup
    type: requirement
    description: Development startup prevents duplicate resource-intensive sessions and uses
      conservative queue concurrency while preserving normal reconciliation behavior.
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: A LocalBooru development session is already active from any worktree
        id: ac-duplicate-launch
        then: The second launch exits immediately with actionable guidance before starting npm, compilation,
          the backend, or library work
        when: Another development launch is attempted
      - given: No LocalBooru development session is active
        id: ac-single-launch
        then: The launcher proceeds normally and releases its single-instance ownership when the session
          exits
        when: Development startup is requested
      - given: Development startup has no explicit task worker override
        id: ac-bounded-workers
        then: Task queue concurrency defaults to one worker while an explicit valid override remains
          authoritative
        when: The backend receives its development environment
    priority: high
    tags: []
