      - _ulid: 01KXPBZ1M4QZKP0YMJP2WQF5DR
        slugs:
          - android-system-bars
        title: Android System Bar Insets
        type: requirement
        description: Keep interactive application content reachable while the Android app renders
          edge-to-edge across system bar, display cutout, orientation, and visibility changes.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: The application is running edge-to-edge with system bars visible
            id: ac-1
            then: The background extends behind the bars while every interactive control remains fully visible
              and reachable
            when: A standard application screen is displayed
          - given: The device has a display cutout or asymmetric system insets
            id: ac-2
            then: Headers, drawers, dialogs, and fixed controls move into the new safe region without a reload
              or stale spacing
            when: The device rotates between portrait and landscape
          - given: The device uses gesture navigation or three-button navigation
            id: ac-3
            then: Controls remain reachable above the navigation region without duplicated blank spacing
            when: Bottom-anchored controls or scrollable pages are shown
          - given: The application uses its dark visual theme
            id: ac-4
            then: Status and navigation controls remain light and legible against the application surface
            when: System bars are visible in device light mode or dark mode
          - given: System bars or display cutout insets change while the application is open
            id: ac-5
            then: Affected application chrome updates immediately without restarting the screen
            when: The visibility or geometry change completes
        tags: []
        created: 2026-07-16T21:05:18.980Z
        notes: []
      - _ulid: 01KXPBZ1WZDZ8W4W83N2CT19Z5
        slugs:
          - android-phone-frontend
        title: Phone Frontend Layout
        type: requirement
        description: Provide reachable navigation and touch-friendly responsive layouts across the
          application on narrow phone screens.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: A phone user opens Gallery, Settings, Directories, Collections, or Collection Detail
            id: ac-1
            then: A visible menu control opens a drawer that can be closed by its close control or backdrop
            when: They need application navigation
          - given: The application viewport is 320 CSS pixels wide
            id: ac-2
            then: Content fits without document-level horizontal scrolling and long values remain readable or
              intentionally truncated
            when: Any primary route, form, card grid, or management screen is displayed
          - given: A phone screen shows fixed gallery actions, batch actions, dialogs, toasts, or sheets
            id: ac-3
            then: Every action remains visible, dismissible, and reachable without obscuring the final
              scrollable content
            when: Safe regions or viewport height change
          - given: A user operates the application with a coarse pointer and no hover capability
            id: ac-4
            then: The required control is visible without hover and provides a touch target at least 44 CSS
              pixels in each required dimension
            when: They navigate, dismiss UI, edit a collection, or invoke a destructive action
          - given: The viewport is wider than the phone breakpoint
            id: ac-5
            then: The established desktop layout and interaction density remain unchanged
            when: The same routes are displayed on desktop
        tags: []
        created: 2026-07-16T21:05:19.263Z
        notes: []
      - _ulid: 01KXPBZ25AK8A8QKB1FMYNNZX1
        slugs:
          - android-phone-lightbox
        title: Phone Lightbox Controls
        type: requirement
        description: Keep media viewing, metadata, playback, subtitles, and curation discoverable and
          touch-safe on phone screens.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: A media item is open on a phone
            id: ac-1
            then: Info, primary actions, overflow actions, and Close remain reachable without clipping or
              overlapping a safe region
            when: The lightbox toolbar is visible
          - given: Video controls have auto-hidden on a phone
            id: ac-2
            then: The controls appear without seeking, navigating, toggling playback, or opening metadata
            when: The user taps the video once
          - given: A user performs a horizontal video seek gesture
            id: ac-3
            then: Only the seek action occurs and the metadata drawer does not open or close
            when: The gesture completes
          - given: A video is open on a phone
            id: ac-4
            then: Time and timeline occupy one row while essential transport, mute, subtitles, and fullscreen
              controls remain reachable on a second row
            when: Playback controls are visible
          - given: The viewport is narrower than 480 CSS pixels and no right-click input is available
            id: ac-5
            then: Both settings surfaces are directly discoverable, scrollable when needed, and explicitly
              closable
            when: The user configures subtitles or opens media metadata
          - given: Lightbox menus, dialogs, status indicators, or curation controls are displayed on a phone
            id: ac-6
            then: The surfaces remain visible and usable without colliding with media transport controls
            when: Viewport height or safe regions change
