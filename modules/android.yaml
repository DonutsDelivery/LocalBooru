  - _ulid: 01KK693VCNSHV7TGK9XB189EKV
    slugs:
      - android-fullscreen
    title: Fullscreen Mode
    type: feature
    description: Provide immersive media viewing that hides Android system bars when active and reliably
      restores them and current layout insets on exit.
    status:
      implementation: in_progress
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: Media is open in the Android lightbox
        id: ac-1
        then: Both system bars hide and the media expands to the full current viewport
        when: The user enters fullscreen
      - given: Fullscreen is active
        id: ac-2
        then: Visible controls remain reachable and immersive viewing resumes while fullscreen remains
          active
        when: System bars transiently appear, the device rotates, or the application resumes
      - given: Fullscreen or the lightbox is active
        id: ac-3
        then: Dark system bars reappear and application chrome uses the current visible insets
        when: The user exits fullscreen, closes the lightbox, or navigates away
      - given: The user repeatedly enters and exits fullscreen
        id: ac-4
        then: Layout spacing remains stable without accumulated padding or stale safe regions
        when: Each transition completes
